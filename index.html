<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>26aTB1 – Termine</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Prüfungen, Termine und Stundenplan der Klasse 26aTB1">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0e1014" media="(prefers-color-scheme: dark)">

  <!-- App aufs Handy -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="26aTB1">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="demo-banner" class="demo-banner" hidden>
    Demo-Modus: Firebase ist noch nicht eingerichtet. Einträge werden nur in diesem Browser gespeichert.
    Login mit <b>klasse</b> oder <b>admin</b> und einem beliebigen Passwort.
  </div>

  <div id="boot" class="boot"><div class="spinner"></div></div>

  <!-- Login -->
  <main id="login-view" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="login-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/></svg>
      </div>
      <h1 class="site-name">26aTB1</h1>
      <p class="muted">Prüfungen &amp; Termine der Klasse</p>
      <label class="field">
        <span>Benutzername</span>
        <input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label class="field">
        <span>Passwort</span>
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="login-error" class="form-error" role="alert" hidden></p>
      <button class="btn primary block" type="submit">Anmelden</button>
    </form>
  </main>

  <!-- App -->
  <div id="app-view" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/></svg>
          </span>
          <span class="site-name">26aTB1</span>
          <span id="role-badge" class="role-badge">Klasse</span>
        </div>

        <div class="view-toggle" role="tablist" aria-label="Ansicht">
          <button role="tab" data-view="calendar" class="active">
            <svg viewBox="0 0 24 24"><path d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/></svg>
            <span>Monat</span>
          </button>
          <button role="tab" data-view="week">
            <svg viewBox="0 0 24 24"><path d="M4 5h16v14H4zM9.3 5v14M14.7 5v14M4 10h16"/></svg>
            <span>Woche</span>
          </button>
          <button role="tab" data-view="list">
            <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>
            <span>Liste</span>
          </button>
          <button role="tab" data-view="games">
            <svg viewBox="0 0 24 24"><path d="M6 11h4M8 9v4M15 12h.01M18 10h.01M7.5 6h9A4.5 4.5 0 0 1 21 10.5v3.2a3.3 3.3 0 0 1-6 1.9L14 14h-4l-1 1.6a3.3 3.3 0 0 1-6-1.9v-3.2A4.5 4.5 0 0 1 7.5 6Z"/></svg>
            <span>Spiele</span>
          </button>
        </div>

        <div class="topbar-actions">
          <button id="btn-news" class="btn ghost news-btn" title="Was ist neu?">
            <svg viewBox="0 0 24 24"><path d="M4 11h16v9a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-9ZM3 7h18v4H3zM12 7v14M12 7S10.5 3 8 3a2 2 0 0 0 0 4h4Zm0 0s1.5-4 4-4a2 2 0 0 1 0 4h-4Z"/></svg>
            <span class="hide-sm">Neu</span>
            <i class="news-dot" hidden></i>
          </button>
          <button id="btn-admin" class="btn ghost admin-only" title="Verwaltung: Kategorien und Import">
            <svg viewBox="0 0 24 24"><path d="M4 7h10M4 17h6M18 7h2M14 17h6M14 4v6M10 14v6"/></svg>
            <span class="hide-sm">Verwaltung</span>
          </button>
          <button id="btn-logout" class="btn ghost" title="Abmelden">
            <svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 8l-4 4 4 4M6 12h10"/></svg>
            <span class="hide-sm">Abmelden</span>
          </button>
        </div>
      </div>
    </header>

    <main class="container">
      <div id="install-banner" class="install-banner" hidden>
        <img src="icons/icon-192.png" alt="" width="40" height="40">
        <div class="install-text">
          <b>Als App aufs Handy</b>
          <span id="install-hint"></span>
        </div>
        <button id="install-btn" class="btn primary sm" hidden>Installieren</button>
        <button id="install-close" class="icon-btn" aria-label="Hinweis schliessen"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </div>

      <div class="toolbar">
        <div id="filters" class="filters" aria-label="Nach Kategorie filtern"></div>
        <button id="btn-add" class="btn primary">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          <span>Eintrag</span>
        </button>
      </div>

      <!-- Monatsansicht -->
      <section id="calendar-view" class="cal-layout">
        <div class="card cal-card">
          <div class="cal-head">
            <h2 id="cal-title"></h2>
            <div class="cal-nav">
              <button id="cal-today" class="btn ghost sm">Heute</button>
              <button id="cal-prev" class="icon-btn" aria-label="Vorheriger Monat"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
              <button id="cal-next" class="icon-btn" aria-label="Nächster Monat"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
            </div>
          </div>
          <div class="cal-weekdays">
            <span>Mo</span><span>Di</span><span>Mi</span><span>Do</span><span>Fr</span><span>Sa</span><span>So</span>
          </div>
          <div id="cal-grid" class="cal-grid"></div>
        </div>

        <aside class="side">
          <div class="card upcoming" id="today-card" hidden>
            <h3 id="today-title">Heute</h3>
            <div id="today-list"></div>
          </div>
          <div class="card upcoming">
            <h3>Demnächst</h3>
            <div id="upcoming-list"></div>
          </div>
        </aside>
      </section>

      <!-- Wochenansicht -->
      <section id="week-view" hidden>
        <div class="card week-card">
          <div class="cal-head">
            <div>
              <h2 id="week-title"></h2>
              <p id="week-sub" class="muted small"></p>
            </div>
            <div class="cal-nav">
              <button id="week-today" class="btn ghost sm">Heute</button>
              <button id="week-prev" class="icon-btn" aria-label="Vorherige Woche"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
              <button id="week-next" class="icon-btn" aria-label="Nächste Woche"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
            </div>
          </div>
          <div id="week-notice"></div>
          <div id="week-grid" class="week-grid"></div>
        </div>
      </section>

      <!-- Listenansicht -->
      <section id="list-view" hidden>
        <div class="list-tools">
          <label class="search">
            <svg viewBox="0 0 24 24"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14ZM20 20l-4-4"/></svg>
            <input id="search" type="search" placeholder="Suchen (Titel, Fach, Notiz)">
          </label>
          <label class="switch">
            <input id="show-past" type="checkbox">
            <span class="track"></span>
            <span>Vergangene anzeigen</span>
          </label>
        </div>
        <div id="event-list"></div>
      </section>

      <!-- Spiele -->
      <section id="games-view" hidden></section>
    </main>
  </div>

  <dialog id="modal" class="modal"><div id="modal-body" class="modal-body"></div></dialog>

  <dialog id="confirm" class="modal small">
    <div class="modal-body">
      <p id="confirm-text"></p>
      <div class="actions">
        <button id="confirm-cancel" class="btn ghost" type="button">Abbrechen</button>
        <button id="confirm-ok" class="btn danger" type="button">Löschen</button>
      </div>
    </div>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
