<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>26aTB1 – Termine</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#5b5bd6">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='10' width='52' height='48' rx='10' fill='%235b5bd6'/%3E%3Crect x='6' y='10' width='52' height='14' rx='7' fill='%234343b8'/%3E%3Crect x='18' y='4' width='6' height='12' rx='3' fill='%234343b8'/%3E%3Crect x='40' y='4' width='6' height='12' rx='3' fill='%234343b8'/%3E%3Ccircle cx='22' cy='38' r='4' fill='white'/%3E%3Ccircle cx='32' cy='38' r='4' fill='white'/%3E%3Ccircle cx='42' cy='38' r='4' fill='white' opacity='.5'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="demo-banner" class="demo-banner" hidden>
    Demo-Modus: Firebase ist noch nicht eingerichtet. Einträge werden nur in diesem Browser gespeichert.
    Login mit <b>klasse</b> oder <b>admin</b> und einem beliebigen Passwort.
  </div>

  <div id="boot" class="boot"><div class="spinner"></div></div>

  <!-- Login -->
  <main id="login-view" class="login" hidden>
    <form id="login-form" class="login-card" autocomplete="on">
      <div class="login-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/></svg>
      </div>
      <h1 class="site-name">26aTB1</h1>
      <p class="muted">Prüfungen &amp; Termine der Klasse</p>
      <label class="field">
        <span>Benutzername</span>
        <input name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
      </label>
      <label class="field">
        <span>Passwort</span>
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="login-error" class="form-error" role="alert" hidden></p>
      <button class="btn primary block" type="submit">Anmelden</button>
    </form>
  </main>

  <!-- App -->
  <div id="app-view" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/></svg>
          </span>
          <span class="site-name">26aTB1</span>
          <span id="role-badge" class="role-badge">Klasse</span>
        </div>

        <div class="view-toggle" role="tablist" aria-label="Ansicht">
          <button role="tab" data-view="calendar" class="active">
            <svg viewBox="0 0 24 24"><path d="M7 3v3M17 3v3M4 9h16M5 5h14a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"/></svg>
            <span>Kalender</span>
          </button>
          <button role="tab" data-view="list">
            <svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01"/></svg>
            <span>Liste</span>
          </button>
        </div>

        <div class="topbar-actions">
          <button id="btn-categories" class="btn ghost admin-only" title="Kategorien verwalten">
            <svg viewBox="0 0 24 24"><path d="M4 7h10M4 17h6M18 7h2M14 17h6M14 4v6M10 14v6"/></svg>
            <span class="hide-sm">Kategorien</span>
          </button>
          <button id="btn-logout" class="btn ghost" title="Abmelden">
            <svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 8l-4 4 4 4M6 12h10"/></svg>
            <span class="hide-sm">Abmelden</span>
          </button>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="toolbar">
        <div id="filters" class="filters" aria-label="Nach Kategorie filtern"></div>
        <button id="btn-add" class="btn primary">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          <span>Eintrag</span>
        </button>
      </div>

      <!-- Kalenderansicht -->
      <section id="calendar-view" class="cal-layout">
        <div class="card cal-card">
          <div class="cal-head">
            <h2 id="cal-title"></h2>
            <div class="cal-nav">
              <button id="cal-today" class="btn ghost sm">Heute</button>
              <button id="cal-prev" class="icon-btn" aria-label="Vorheriger Monat"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button>
              <button id="cal-next" class="icon-btn" aria-label="Nächster Monat"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
            </div>
          </div>
          <div class="cal-weekdays">
            <span>Mo</span><span>Di</span><span>Mi</span><span>Do</span><span>Fr</span><span>Sa</span><span>So</span>
          </div>
          <div id="cal-grid" class="cal-grid"></div>
        </div>

        <aside class="card upcoming">
          <h3>Demnächst</h3>
          <div id="upcoming-list"></div>
        </aside>
      </section>

      <!-- Listenansicht -->
      <section id="list-view" hidden>
        <div class="list-tools">
          <label class="search">
            <svg viewBox="0 0 24 24"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14ZM20 20l-4-4"/></svg>
            <input id="search" type="search" placeholder="Suchen (Titel, Fach, Notiz)">
          </label>
          <label class="switch">
            <input id="show-past" type="checkbox">
            <span class="track"></span>
            <span>Vergangene anzeigen</span>
          </label>
        </div>
        <div id="event-list"></div>
      </section>
    </main>
  </div>

  <dialog id="modal" class="modal"><div id="modal-body" class="modal-body"></div></dialog>

  <dialog id="confirm" class="modal small">
    <div class="modal-body">
      <p id="confirm-text"></p>
      <div class="actions">
        <button id="confirm-cancel" class="btn ghost" type="button">Abbrechen</button>
        <button id="confirm-ok" class="btn danger" type="button">Löschen</button>
      </div>
    </div>
  </dialog>

  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
